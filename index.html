<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>

  <style>
    body {
      background-color: #f8e8ed;
      font-family: 'Georgia', serif;
      color: #55434a;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background-color: #fffafc;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(100, 60, 75, 0.10);
    }

    h1 {
      color: #a76d83;
      font-size: 38px;
    }

    h2 {
      color: #a76d83;
      margin-top: 40px;
    }

    p {
      line-height: 1.7;
      font-size: 17px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin: 25px auto;
      overflow: hidden;
      border-radius: 15px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    a {
      color: #a76d83;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      color: #d28ba7;
    }

    embed {
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome to My Website!</h1>

    <p>
      This is my personal website. Welcome!
    </p>

    <h2>My YouTube Video</h2>

    <div class="video-container">
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <h2>My PDF Document</h2>

    <p>
      <a href="YOUR_PDF_LINK" target="_blank">
        Click here to view my PDF in a new tab
      </a>
    </p>

    <embed
      src="YOUR_PDF_LINK"
      type="application/pdf"
      width="100%"
      height="600px"
    />

  </div>

</body>
</html>
